<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Remote Work Board — Acesso</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061a31;color:#fff;font:16px Arial,sans-serif}
#loading{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:28px}.box{max-width:420px}.spin{width:34px;height:34px;border:4px solid #ffffff55;border-top-color:#fff;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#cbd5e1;line-height:1.5}
#boardFrame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#061a31}
</style></head><body><main id="loading"><div class="box"><div class="spin"></div><h2>A abrir o Remote Work Board...</h2><p id="status">A validar o convite. Aguarde um momento.</p></div></main><iframe id="boardFrame" title="Remote Work Board" allow="camera; microphone; display-capture; fullscreen; clipboard-read; clipboard-write; autoplay; picture-in-picture" allowfullscreen referrerpolicy="same-origin"></iframe><script>
(async()=>{const m=location.pathname.match(/^\/(r|a|c)\/([A-Za-z0-9_-]{4,20})\/?$/);const status=document.getElementById("status");if(!m){status.textContent="Este endereço não foi encontrado. Confirme o link que recebeu.";return}try{const response=await fetch("https://quadro-azny-default-rtdb.firebaseio.com/aznyShortLinks/"+encodeURIComponent(m[2])+".json",{cache:"no-store"});if(!response.ok)throw new Error("Não foi possível consultar o convite.");const data=await response.json();if(!data||!data.target)throw new Error("Este convite não existe ou já não está disponível.");const destination=new URL(data.target,location.origin);if(destination.origin!==location.origin)throw new Error("O endereço do convite não é válido.");const expected=(m[1]==="c"&&data.type==="class"&&destination.pathname.endsWith("/quadro_virtual_azny_quadro.html"))||((m[1]==="r"&&data.type==="meeting"||m[1]==="a"&&data.type==="activity")&&destination.pathname.endsWith("/azny_business.html"));if(!expected)throw new Error("O tipo ou destino do convite não corresponde ao endereço.");const frame=document.getElementById("boardFrame");frame.src=destination.href;frame.style.display="block";document.getElementById("loading").style.display="none"}catch(e){status.textContent=e.message||"Não foi possível abrir o convite. Verifique a ligação à internet e tente novamente."}})();
</script></body></html>
