<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>A abrir convite — Remote Work Board</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061a31;color:#fff;font:16px Arial,sans-serif}.box{text-align:center;padding:32px;max-width:420px}.spin{width:34px;height:34px;border:4px solid #ffffff55;border-top-color:#fff;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#cbd5e1;line-height:1.5}</style></head><body><main class="box"><div class="spin"></div><h2>A abrir o convite...</h2><p id="status">A localizar a reunião ou atividade. Aguarde um momento.</p></main><script>
(async()=>{const m=location.pathname.match(/^\/(r|a)\/([A-Za-z0-9_-]{4,20})\/?$/);const status=document.getElementById("status");if(!m){status.textContent="Este endereço não foi encontrado. Confirme o link que recebeu.";return}try{const response=await fetch("https://quadro-azny-default-rtdb.firebaseio.com/aznyShortLinks/"+encodeURIComponent(m[2])+".json",{cache:"no-store"});if(!response.ok)throw new Error("Não foi possível consultar o convite.");const data=await response.json();if(!data||!data.target)throw new Error("Este convite não existe ou já não está disponível.");const destination=new URL(data.target,location.origin);if(destination.origin!==location.origin||!destination.pathname.endsWith("/azny_business.html"))throw new Error("O destino deste convite não é válido.");if((m[1]==="r"&&data.type!=="meeting")||(m[1]==="a"&&data.type!=="activity"))throw new Error("O tipo de convite não corresponde ao endereço.");location.replace(destination.href)}catch(e){status.textContent=e.message||"Não foi possível abrir o convite. Verifique a ligação à internet e tente novamente."}})();
</script></body></html>
