<!doctype html>
<html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b33"><meta name="robots" content="noindex"><title>AZNY · Avaliação</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f8;color:#071b33;font:16px system-ui,Arial}.card{margin:20px;padding:30px;max-width:420px;text-align:center;background:#fff;border:1px solid #dbe4ed;border-radius:22px;box-shadow:0 14px 38px #071b3310}.logo{font-size:24px;font-weight:900}.logo span{color:#1677ff}.muted{color:#64748b;line-height:1.6}.spin{width:28px;height:28px;border:3px solid #dbe4ed;border-top-color:#1677ff;border-radius:50%;margin:20px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}a{color:#1677ff}</style></head><body><main class="card"><div class="logo">AZNY <span>AVALIAÇÕES</span></div><h1>A abrir a avaliação…</h1><p class="muted">A validar o link privado partilhado pelo professor. Aguarde um instante.</p><div class="spin" aria-hidden="true"></div><p class="muted"><a id="fallback" href="../exames.html">Se não abrir automaticamente, toque aqui.</a></p></main><script>(()=>{const incoming=new URL(location.href);const id=incoming.searchParams.get("id");if(!id){location.replace(new URL("../exames.html",location.href).href);return}const target=new URL("../responder/",location.href);incoming.searchParams.forEach((v,k)=>target.searchParams.set(k,v));document.getElementById("fallback").href=target.href;location.replace(target.href)})();</script></body></html>
