<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remote Work Board — Quadro Virtual</title>
<meta name="theme-color" content="#071b33">
<style>
*{box-sizing:border-box}body{margin:0;font:16px Inter,Segoe UI,Arial,sans-serif;background:#eef3f8;color:#172536;min-height:100vh}.top{background:#071b33;color:#fff;padding:18px 22px;font-weight:900;font-size:20px}.wrap{max-width:760px;margin:32px auto;padding:0 16px}.card{background:#fff;border:1px solid #dbe4ed;border-radius:18px;padding:26px;box-shadow:0 8px 25px #071b3310}.muted{color:#64748b;line-height:1.6}.badge{display:inline-block;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:800;background:#e8f8ed;color:#17733a}.badge.warn{background:#fff3d8;color:#8a5b00}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:11px;padding:14px 20px;background:#1677ff;color:#fff;font:800 16px Inter,Arial,sans-serif;cursor:pointer;text-decoration:none;min-height:48px}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.logout{background:#edf2f7;color:#172536}.status{margin:14px 0}@media(max-width:560px){.wrap{margin:18px auto}.card{padding:20px}.actions .btn{width:100%}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head><body><header class="top">Remote Work Board</header><main class="wrap"><section class="card"><h1 id="hello">O seu quadro virtual</h1><p class="muted">Aceda diretamente ao quadro verde para iniciar ou continuar as suas aulas. Mantivemos apenas o acesso ao quadro, sem portal de alunos, publicação de cursos ou módulos de avaliações.</p><div id="licenseStatus" class="badge">A validar acesso…</div><div class="actions"><button class="btn" id="openBoard" disabled>Entrar no quadro verde</button><a class="btn" id="upgradePlan" href="#" hidden>Atualizar plano</a><button class="btn logout" id="logout">Terminar sessão</button></div><p id="message" class="muted status" role="status" aria-live="polite"></p></section></main>
<script>
(()=>{"use strict";
const cfg={"apiKey":"AIzaSyAIKbk7l-CAGmwpRgLAhccpnra8cKTNRUc","authDomain":"remot-board.firebaseapp.com","databaseURL":"https://remot-board-default-rtdb.firebaseio.com","projectId":"remot-board","storageBucket":"remot-board.firebasestorage.app","messagingSenderId":"931887981666","appId":"1:931887981666:web:08899cca83f1f514191d3b","measurementId":"G-HH3SERFF32"};
if(!firebase.apps.length)firebase.initializeApp(cfg);const auth=firebase.auth(),db=firebase.database();
const qs=new URLSearchParams(location.search),token=qs.get("acesso")||sessionStorage.getItem("azny_access_token")||"",status=document.getElementById("licenseStatus"),button=document.getElementById("openBoard"),message=document.getElementById("message");
async function init(){try{
 const user=auth.currentUser;
 if(!user||!user.email){status.className="badge warn";status.textContent="Sessão não autenticada";message.textContent="Volte à página inicial e entre com o e-mail da sua conta.";return}
 if(!token)throw new Error("Não foi encontrado o código de acesso da licença. Entre novamente pela página inicial.");
 const snap=await db.ref("licenses/"+token).once("value"),license=snap.val();
 if(!license||!["active","trial_exhausted"].includes(String(license.status||""))||String(license.teacherEmail||"").toLowerCase()!==String(user.email).toLowerCase()||(license.teacherUid&&license.teacherUid!==user.uid)){status.className="badge warn";status.textContent="Acesso não validado";message.textContent="A licença desta conta não está ativa ou não corresponde ao utilizador autenticado. Contacte a administração.";return}
 const accessToken=license.accessToken||token;sessionStorage.setItem("azny_access_token",accessToken);document.getElementById("hello").textContent="Bem-vindo, "+(license.teacherName||"Professor");
 const expired=license.expiresAt&&new Date(license.expiresAt)<=new Date(),isTrial=license.plan==="trial",used=Number(license.trialSessionsUsed||Object.keys(license.trialCompletedSessions||{}).length),limit=2,exhausted=isTrial&&(license.trialExhausted===true||license.status==="trial_exhausted"||used>=limit),upgrade=document.getElementById("upgradePlan");
 if(isTrial&&!exhausted){status.className="badge";status.textContent="Plano de teste — "+used+"/"+limit+" aulas concluídas";message.textContent="Tem "+(limit-used)+" aula(s) disponível(is)."}
 else if(exhausted){status.className="badge warn";status.textContent="Teste concluído — 2/2 aulas";message.textContent="O teste terminou. Atualize o plano para voltar a dar aulas.";button.disabled=true;upgrade.hidden=false;upgrade.href="index.html?upgrade=1&acesso="+encodeURIComponent(accessToken)}
 else if(expired){status.className="badge warn";status.textContent="Plano expirado";message.textContent="Atualize o plano para voltar a utilizar o quadro.";button.disabled=true;upgrade.hidden=false;upgrade.href="index.html?upgrade=1&acesso="+encodeURIComponent(accessToken)}
 else{status.className="badge";status.textContent="Acesso ativo";message.textContent="A sua licença foi confirmada no Firebase Realtime Database."}
 if(!exhausted&&!expired)button.disabled=false;
}catch(error){status.className="badge warn";status.textContent="Falha na validação";message.textContent=error.message||"Não foi possível confirmar o acesso.";console.error(error)}}
button.onclick=async()=>{try{if(screen.orientation?.lock)await screen.orientation.lock("landscape")}catch(error){console.info("Orientação horizontal não disponível:",error)}location.href="aulas/?acesso="+encodeURIComponent(token)};
document.getElementById("logout").onclick=async()=>{sessionStorage.removeItem("azny_access_token");await auth.signOut().catch(()=>{});location.href="index.html"};auth.onAuthStateChanged(user=>{if(user)init();else{status.className="badge warn";status.textContent="Sessão não autenticada";message.textContent="Volte à página inicial e entre com o e-mail da sua conta."}});
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js",{scope:"/QUADRO-AZNY/"}).catch(console.warn));}</script>
</body></html>
