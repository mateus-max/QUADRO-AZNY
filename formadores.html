let courseVideoObserver=null;
function activateCourseVideos(){
 if(courseVideoObserver){courseVideoObserver.disconnect();courseVideoObserver=null}
 const videos=[...document.querySelectorAll('#courses video.course-video')];
 videos.forEach(video=>{
  video.muted=true;video.defaultMuted=true;video.playsInline=true;video.preload='auto';
  video.addEventListener('play',()=>{video.dataset.userPaused='0';video.dataset.autoPaused='0'});
  video.addEventListener('pause',()=>{if(video.dataset.autoPaused==='1'){video.dataset.autoPaused='0';return}if(video.dataset.inView==='1')video.dataset.userPaused='1'});
  video.addEventListener('error',()=>{video.classList.add('video-unavailable');video.setAttribute('aria-label','Este vídeo não pôde ser reproduzido. O professor deve substituir a apresentação.')},{once:true});
 });
 const visibility=entries=>{entries.forEach(entry=>{const video=entry.target,visible=entry.isIntersecting&&entry.intersectionRatio>=0.6;video.dataset.inView=visible?'1':'0';if(visible){if(video.dataset.userPaused!=='1'){video.muted=true;const attempt=video.play();if(attempt&&typeof attempt.catch==='function')attempt.catch(()=>{})}}else if(!video.paused){video.dataset.autoPaused='1';video.pause()}})};
 if('IntersectionObserver' in window){courseVideoObserver=new IntersectionObserver(visibility,{threshold:[0,0.6,1],rootMargin:'0px'});videos.forEach(v=>courseVideoObserver.observe(v))}
 else{videos.forEach(v=>{v.muted=true;v.play().catch(()=>{})})}
}

document.addEventListener("click",e=>{const author=e.target.closest("[data-course-author]");if(author){openProfileByUid(author.dataset.courseAuthor);return}const more=e.target.closest("[data-profile-index]");if(more)openProfile(Number(more.dataset.profileIndex));const vc=e.target.closest("[data-teacher-courses]");if(vc){const uid=vc.dataset.teacherCourses;const list=courses.filter(c=>c.teacherUid===uid);if(list.length){$("search").value=list[0].title;render()}$("courses-section").scrollIntoView({behavior:"smooth"})}});
/* Com ligação disponível, carregar sempre a versão actual do Realtime Database; a cache não deve substituir o conteúdo real. */
db.ref("publicTeacherProfiles").on("value",snap=>{teachers=[];profilesByUid={};snap.forEach(ch=>{const p=ch.val();if(p&&p.uid&&p.name){teachers.push({...p,_key:ch.key});profilesByUid[p.uid]=p}});teachers.sort((a,b)=>Number(b.updatedAt||b.createdAt||0)-Number(a.updatedAt||a.createdAt||0));teachersReady=true;if(coursesReady)render()},err=>{teachersReady=true;console.warn("AZNY: erro ao carregar perfis",err)});
db.ref("publicTeacherCourses").on("value",snap=>{clearTimeout(courseLoadFallback);courses=[];snap.forEach(ch=>{const c=ch.val();if(c&&c.status==="approved"&&c.title&&!c.deleted&&!c.deletedAt&&!c.removedAt&&!c.isDeleted)courses.push({...c,_key:ch.key})});courses.sort((a,b)=>Number(b.updatedAt||b.approvedAt||b.createdAt||0)-Number(a.updatedAt||a.approvedAt||a.createdAt||0));coursesReady=true;saveCachedCourses(courses);render();courses.forEach(recoverCourseMedia)},err=>{console.error("AZNY: erro ao carregar cursos",err);if(!coursesReady){$("courseCount").textContent="Não foi possível carregar os cursos";$("courses").innerHTML='<div class="empty"><strong>Sem ligação ao servidor.</strong>Verifique a internet e tente novamente.</div>'}});
})();
