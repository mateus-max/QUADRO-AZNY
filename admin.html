<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Remote Work Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#17283b;font:14px Segoe UI,Arial,sans-serif}.head{background:#071b33;color:white;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center}.head b{font-size:19px}.wrap{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:white;border:1px solid #dce4ec;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 6px 22px #12243a0a}.hidden{display:none!important}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#1769d2;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#e9eef5;color:#20344a}.danger{background:#b42318}.muted{color:#617286}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.request{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.8fr);gap:18px;border-top:1px solid #e5ebf1;padding:18px 0}.request:first-child{border:0}.proof{width:100%;height:300px;border:1px solid #dce4ec;border-radius:8px;background:#f6f8fa}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#fff1cc;color:#805800;font-weight:800}.error{color:#b42318}.ok{color:#187a35}@media(max-width:720px){.request{grid-template-columns:1fr}.proof{height:220px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
</head><body><header class="head"><b>Remote Work Board · Administração</b><button id="logout" class="secondary hidden">Terminar sessão</button></header>
<main class="wrap"><section id="login" class="card"><h2>Acesso administrativo</h2><p class="muted">Entre com a conta administrativa já registada no Firebase Authentication.</p><label for="adminEmail">E-mail</label><input id="adminEmail" type="email" autocomplete="username" value="suporte@domingas.com" style="display:block;width:100%;padding:12px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:8px"><label for="adminPassword">Senha</label><input id="adminPassword" type="password" autocomplete="current-password" style="display:block;width:100%;padding:12px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:8px"><button id="loginBtn">Entrar</button><p id="loginMsg" class="muted"></p></section>
<section id="panel" class="hidden"><div class="card row"><div style="flex:1"><h2 style="margin:0">Pedidos de pagamento</h2><p id="identity" class="muted"></p></div><button id="refresh" class="secondary">Atualizar pedidos</button></div><div class="card"><h2>Contas de professores</h2><p class="muted">Lista ligada ao Firebase Realtime Database. As alterações aparecem automaticamente.</p><div id="accountMessage">A carregar contas…</div><div id="teacherAccounts"></div></div><div id="message" class="card muted">A carregar…</div><div id="requests" class="card"></div></section></main>
<script>
const cfg={apiKey:"AIzaSyAIKbk7l-CAGmwpRgLAhccpnra8cKTNRUc",authDomain:"remot-board.firebaseapp.com",databaseURL:"https://remot-board-default-rtdb.firebaseio.com",projectId:"remot-board",storageBucket:"remot-board.firebasestorage.app",messagingSenderId:"931887981666",appId:"1:931887981666:web:08899cca83f1f514191d3b",measurementId:"G-HH3SERFF32"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const auth=firebase.auth(),db=firebase.database(),functions=firebase.app().functions("us-central1");const $=id=>document.getElementById(id);let requestsRef=null,realtimeHandler=null,accountsRef=null,accountsHandler=null,allRequests={},allAccounts={};
const planSpecs={basic:{name:"Básico",students:10,dailyClasses:2,simultaneous:1,duration:2,storage:"10 GB temporários"},professional:{name:"Profissional",students:45,dailyClasses:3,simultaneous:2,duration:4,storage:"50 GB temporários"},school:{name:"Escola",students:50,dailyClasses:3,simultaneous:5,duration:6,storage:"100 GB temporários"},trial:{name:"Teste experimental — 2 aulas",students:45,dailyClasses:3,simultaneous:1,duration:2,storage:"Temporário",trialSessionsLimit:2}};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(v){return Number(v||0).toLocaleString("pt-AO")+" Kz"}
$("loginBtn").onclick=async()=>{const email=$("adminEmail").value.trim().toLowerCase(),password=$("adminPassword").value;if(email!=="suporte@domingas.com"){$("loginMsg").textContent="Use o e-mail administrativo autorizado.";return}if(!password){$("loginMsg").textContent="Introduza a senha.";return}$("loginBtn").disabled=true;try{await auth.signInWithEmailAndPassword(email,password)}catch(e){$("loginMsg").textContent="Não foi possível entrar: "+e.message}finally{$("loginBtn").disabled=false}};
$("logout").onclick=()=>auth.signOut();$("refresh").onclick=()=>{load();loadAccounts()};
auth.onAuthStateChanged(user=>{if(!user){if(requestsRef&&realtimeHandler)requestsRef.off("value",realtimeHandler);requestsRef=null;realtimeHandler=null;$("login").classList.remove("hidden");$("panel").classList.add("hidden");$("logout").classList.add("hidden");return}if((user.email||"").toLowerCase()!=="suporte@domingas.com"){auth.signOut();return}$("login").classList.add("hidden");$("panel").classList.remove("hidden");$("logout").classList.remove("hidden");$("identity").textContent=user.email||user.uid;load();loadAccounts()});
function load(){ $("message").textContent="A ligar ao Firebase Realtime Database…";if(requestsRef&&realtimeHandler)requestsRef.off("value",realtimeHandler);requestsRef=db.ref("paymentRequests");realtimeHandler=snap=>{allRequests=snap.val()||{};render()};requestsRef.on("value",realtimeHandler,error=>{$("message").textContent="Falha ao ler pedidos: "+error.message});}

function loadAccounts(){accountsRef=db.ref("teacherRegistrationRequests");accountsHandler=s=>{allAccounts=s.val()||{};renderAccounts()};accountsRef.off("value");accountsRef.on("value",accountsHandler,e=>{$("accountMessage").textContent="Erro ao receber contas: "+e.message})}
function renderAccounts(){const rows=Object.entries(allAccounts).map(([uid,x])=>({uid,...(x||{})}));$("accountMessage").textContent=rows.length+" pedido(s) de conta — sincronização em tempo real.";$("teacherAccounts").innerHTML=rows.map(x=>{const st=x.status||"pending";return '<article class="request"><div><h3>'+esc(x.name)+' <span class="pill">'+esc(st)+'</span></h3><p>'+esc(x.email)+'<br>'+esc(x.createdAt||"")+'</p><div class="row"><button data-review="approve" data-uid="'+esc(x.uid)+'">Aprovar</button><button class="danger" data-review="reject" data-uid="'+esc(x.uid)+'">Rejeitar</button><button class="danger" data-review="delete" data-uid="'+esc(x.uid)+'">Eliminar</button></div></div></article>'}).join("")||'<p class="muted">Sem pedidos de conta.</p>';$("teacherAccounts").querySelectorAll("[data-review]").forEach(b=>b.onclick=async()=>{const action=b.dataset.review;if(!confirm("Confirma esta operação?"))return;const note=action==="reject"?(prompt("Motivo (opcional):")||""):"";b.disabled=true;try{await functions.httpsCallable("reviewTeacherRegistration")({uid:b.dataset.uid,action,note})}catch(e){alert(e.message||e.code);b.disabled=false}})}
function render(){const items=Object.values(allRequests).filter(Boolean).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));if(!items.length){$("message").textContent="Não existem pedidos de pagamento."; $("requests").innerHTML="";return}$("message").textContent=items.length+" pedido(s) — actualização em tempo real pelo Realtime Database.";$("requests").innerHTML=items.map(x=>'<article class="request"><div><h3>'+esc(x.name)+' <span class="pill">'+esc(x.status)+'</span></h3><p><b>E-mail:</b> '+esc(x.email)+'<br><b>Plano:</b> '+esc(x.planName||x.plan)+'<br><b>Valor:</b> '+money(x.amount)+'<br><b>Método:</b> '+esc(x.method||"")+'<br><b>Data:</b> '+esc(x.createdAt)+'</p><p>'+esc(x.adminNote||"")+'</p><div class="row"><button class="secondary" data-proof="'+esc(x.id)+'">Ver comprovativo</button>'+(x.status==="pending"?'<button data-id="'+esc(x.id)+'" data-status="approved">Aprovar</button><button class="danger" data-id="'+esc(x.id)+'" data-status="rejected">Rejeitar</button>':"")+'</div></div><div id="proof-'+esc(x.id)+'" class="proof" style="display:grid;place-items:center">Comprovativo guardado no Realtime Database.</div></article>').join("");$("requests").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>decide(b.dataset.id,b.dataset.status,b));$("requests").querySelectorAll("button[data-proof]").forEach(b=>b.onclick=()=>viewProof(b.dataset.proof));}
function viewProof(id){const x=allRequests[id];const box=$("proof-"+id);const proof=String(x?.proof||"");if(!/^data:(image\/(png|jpeg|webp)|application\/pdf);base64,/.test(proof)){box.textContent="Comprovativo não encontrado ou formato inválido.";return}if(proof.startsWith("data:application/pdf"))box.innerHTML='<iframe class="proof" src="'+proof+'"></iframe>';else box.innerHTML='<img class="proof" style="object-fit:contain" src="'+proof+'">';}
async function decide(id,status,button){const current=allRequests[id];if(!current||current.status!=="pending"){alert("Este pedido já não está pendente. Actualize a lista.");return}const note=status==="rejected"?(prompt("Motivo da rejeição (opcional):")||""):"";if(!confirm(status==="approved"?"Confirmar aprovação? A licença e a conta do professor serão activadas.":"Confirmar rejeição deste pedido?"))return;button.disabled=true;const ref=db.ref("paymentRequests/"+id);try{const tx=await ref.transaction(value=>{if(!value||value.status!=="pending")return;return {...value,status:"processing",adminNote:note}});if(!tx.committed)throw new Error("O pedido já foi alterado por outro administrador.");const approved=tx.snapshot.val();const now=new Date().toISOString();const updates={};const adminUid=auth.currentUser.uid;
if(status==="approved"){const planKey=String(approved.plan||"");const plan=planSpecs[planKey];const email=String(approved.email||"").trim().toLowerCase();if(!plan||!email)throw new Error("Pedido sem plano ou e-mail válido.");const token=String(approved.accessToken||approved.existingAccessToken||"").trim()||crypto.randomUUID();const license={status:"active",trialExhausted:false,boardAccess:true,plan:planKey,planName:String(approved.planName||plan.name),...plan,...(planKey==="trial"?{trialSessionsLimit:2,trialSessionsUsed:0,trialCompletedSessions:{}}:{}),startedAt:now,expiresAt:null,teacherName:String(approved.name||email),teacherPhone:String(approved.phone||""),requestId:id,accessToken:token,teacherEmail:email};updates["licenses/"+token]=license;if(approved.uid)updates["teacherAccounts/"+approved.uid]={uid:approved.uid,name:license.teacherName,email,role:"teacher",accountStatus:"active",plan:planKey,planName:license.planName,accessToken:token,activatedAt:firebase.database.ServerValue.TIMESTAMP,updatedAt:firebase.database.ServerValue.TIMESTAMP};updates["paymentRequests/"+id]={...approved,status:"approved",accountStatus:"active",accessGranted:true,accessToken:token,approvedBy:adminUid,approvedAt:now,activatedAt:firebase.database.ServerValue.TIMESTAMP,reviewedAt:firebase.database.ServerValue.TIMESTAMP};const oldToken=String(approved.existingAccessToken||"").trim();if(oldToken&&oldToken!==token){updates["licenses/"+oldToken+"/status"]="replaced";updates["licenses/"+oldToken+"/replacedBy"]=token;updates["licenses/"+oldToken+"/replacedAt"]=firebase.database.ServerValue.TIMESTAMP}}
else{updates["paymentRequests/"+id]={...approved,status:"rejected",accountStatus:"rejected",accessGranted:false,adminNote:note,approvedBy:adminUid,approvedAt:null,reviewedAt:firebase.database.ServerValue.TIMESTAMP};if(approved.accessToken){updates["licenses/"+approved.accessToken+"/status"]="suspended";updates["licenses/"+approved.accessToken+"/boardAccess"]=false;updates["licenses/"+approved.accessToken+"/revokedAt"]=firebase.database.ServerValue.TIMESTAMP;updates["licenses/"+approved.accessToken+"/revokedBy"]=adminUid}}
updates["auditLogs/"+db.ref("auditLogs").push().key]={action:"payment_"+status,requestId:id,adminUid,at:firebase.database.ServerValue.TIMESTAMP};await db.ref().update(updates);
}catch(e){console.error("Decisão de pagamento:",e);try{await ref.child("status").set("pending")}catch(_){}alert("Não foi possível concluir: "+e.message);button.disabled=false}}
</script></body></html>
