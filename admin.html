<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Remote Work Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#17283b;font:14px Segoe UI,Arial,sans-serif}.head{background:#071b33;color:white;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center}.head b{font-size:19px}.wrap{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:white;border:1px solid #dce4ec;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 6px 22px #12243a0a}.hidden{display:none!important}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#1769d2;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#e9eef5;color:#20344a}.danger{background:#b42318}.muted{color:#617286}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.request{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.8fr);gap:18px;border-top:1px solid #e5ebf1;padding:18px 0}.request:first-child{border:0}.proof{width:100%;height:300px;border:1px solid #dce4ec;border-radius:8px;background:#f6f8fa}.proof-panel{margin-top:12px;padding:12px;border:1px solid #dce4ec;border-radius:10px;background:#f8fafc}.proof-panel .proof{display:block}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#fff1cc;color:#805800;font-weight:800}.error{color:#b42318}.ok{color:#187a35}@media(max-width:720px){.request{grid-template-columns:1fr}.proof{height:220px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
</head><body><header class="head"><b>Remote Work Board · Administração</b><button id="logout" class="secondary hidden">Terminar sessão</button></header>
<main class="wrap"><section id="login" class="card"><h2>Acesso administrativo</h2><p class="muted">Entre com a conta administrativa já registada no Firebase Authentication.</p><label for="adminEmail">E-mail</label><input id="adminEmail" type="email" autocomplete="username" value="suporte@domingas.com" style="display:block;width:100%;padding:12px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:8px"><label for="adminPassword">Senha</label><input id="adminPassword" type="password" autocomplete="current-password" style="display:block;width:100%;padding:12px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:8px"><button id="loginBtn">Entrar</button><p id="loginMsg" class="muted"></p></section>
<section id="panel" class="hidden"><div class="card row"><div style="flex:1"><h2 style="margin:0">Pedidos de pagamento</h2><p id="identity" class="muted"></p></div><button id="refresh" class="secondary">Atualizar pedidos</button></div><div class="card"><h2>Contas de professores</h2><p class="muted">Lista ligada ao Firebase Realtime Database. As alterações aparecem automaticamente.</p><div id="accountMessage">A carregar contas…</div><div id="teacherAccounts"></div></div><div id="message" class="card muted">A carregar…</div><div id="requests" class="card"></div></section></main>
<script>
const cfg={apiKey:"AIzaSyAIKbk7l-CAGmwpRgLAhccpnra8cKTNRUc",authDomain:"remot-board.firebaseapp.com",databaseURL:"https://remot-board-default-rtdb.firebaseio.com",projectId:"remot-board",storageBucket:"remot-board.firebasestorage.app",messagingSenderId:"931887981666",appId:"1:931887981666:web:08899cca83f1f514191d3b",measurementId:"G-HH3SERFF32"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const auth=firebase.auth(),db=firebase.database(),functions=firebase.app().functions("us-central1");const $=id=>document.getElementById(id);let requestsRef=null,realtimeHandler=null,accountsRef=null,accountsHandler=null,allRequests={},allAccounts={};
const planSpecs={basic:{name:"Básico",students:10,dailyClasses:2,simultaneous:1,duration:2,storage:"10 GB temporários"},professional:{name:"Profissional",students:45,dailyClasses:3,simultaneous:2,duration:4,storage:"50 GB temporários"},school:{name:"Escola",students:50,dailyClasses:3,simultaneous:5,duration:6,storage:"100 GB temporários"},trial:{name:"Teste experimental — 2 aulas",students:45,dailyClasses:3,simultaneous:1,duration:2,storage:"Temporário",trialSessionsLimit:2}};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(v){return Number(v||0).toLocaleString("pt-AO")+" Kz"}
$("loginBtn").onclick=async()=>{const email=$("adminEmail").value.trim().toLowerCase(),password=$("adminPassword").value;if(email!=="suporte@domingas.com"){$("loginMsg").textContent="Use o e-mail administrativo autorizado.";return}if(!password){$("loginMsg").textContent="Introduza a senha.";return}$("loginBtn").disabled=true;try{await auth.signInWithEmailAndPassword(email,password)}catch(e){$("loginMsg").textContent="Não foi possível entrar: "+e.message}finally{$("loginBtn").disabled=false}};
$("logout").onclick=()=>auth.signOut();$("refresh").onclick=()=>{load();loadAccounts()};
auth.onAuthStateChanged(user=>{if(!user){if(requestsRef&&realtimeHandler)requestsRef.off("value",realtimeHandler);if(accountsRef&&accountsHandler)accountsRef.off("value",accountsHandler);requestsRef=null;realtimeHandler=null;accountsRef=null;accountsHandler=null;$("login").classList.remove("hidden");$("panel").classList.add("hidden");$("logout").classList.add("hidden");return}if((user.email||"").toLowerCase()!=="suporte@domingas.com"){auth.signOut();return}$("login").classList.add("hidden");$("panel").classList.remove("hidden");$("logout").classList.remove("hidden");$("identity").textContent=user.email||user.uid;load();loadAccounts()});
function load(){ $("message").textContent="A ligar ao Firebase Realtime Database…";if(requestsRef&&realtimeHandler)requestsRef.off("value",realtimeHandler);requestsRef=db.ref("paymentRequests");realtimeHandler=snap=>{allRequests=snap.val()||{};render()};requestsRef.on("value",realtimeHandler,error=>{$("message").textContent="Falha ao ler pedidos: "+error.message});}

function loadAccounts(){if(accountsRef&&accountsHandler)accountsRef.off("value",accountsHandler);accountsRef=db.ref("teacherAccounts");accountsHandler=s=>{allAccounts=s.val()||{};renderAccounts()};accountsRef.on("value",accountsHandler,e=>{$("accountMessage").textContent="Erro ao receber contas: "+e.message})}
function renderAccounts(){
 const rows=Object.entries(allAccounts).map(([uid,x])=>({uid,...(x||{})}));
 $("accountMessage").textContent=rows.length+" pedido(s) de conta — sincronização em tempo real.";
 $("teacherAccounts").innerHTML=rows.map(x=>{
  const st=x.status||"pending";
  return '<article class="request"><div><h3>'+esc(x.name)+' <span class="pill">'+esc(st)+'</span></h3><p>'+esc(x.email)+'<br>'+esc(x.createdAt||"")+'</p><div class="row"><button data-review="approve" data-uid="'+esc(x.uid)+'">Aprovar</button><button class="danger" data-review="reject" data-uid="'+esc(x.uid)+'">Rejeitar solicitação</button><button class="danger" data-review="delete" data-uid="'+esc(x.uid)+'">Eliminar conta</button></div></div></article>'
 }).join("")||'<p class="muted">Sem pedidos de conta.</p>';
 $("teacherAccounts").querySelectorAll("button[data-review]").forEach(button=>{
  button.onclick=async()=>{
   const action=button.dataset.review,uid=button.dataset.uid;
   const labels={approve:"aprovar esta conta",reject:"rejeitar esta solicitação",delete:"eliminar definitivamente esta conta e os seus pedidos"};
   if(!confirm("Confirma que pretende "+labels[action]+"?"))return;
   const note=action==="reject"?(prompt("Motivo da rejeição (opcional):")||""):"";
   const original=button.textContent;
   button.disabled=true;button.textContent=action==="approve"?"A aprovar…":action==="reject"?"A rejeitar…":"A eliminar…";
   try{
    const result=await functions.httpsCallable("reviewTeacherRegistration")({uid,action,note});
    if(!result?.data?.ok)throw new Error("O servidor não confirmou a operação.");
    if(action==="delete"){
     delete allAccounts[uid];renderAccounts();
     $("accountMessage").textContent="Conta eliminada com sucesso.";
    }else{
     const updated={...(allAccounts[uid]||{}),status:action==="approve"?"approved":"rejected",accountStatus:action==="approve"?"approved":"rejected"};
     if(action==="reject"&&note)updated.adminNote=note;
     allAccounts[uid]=updated;renderAccounts();
     $("accountMessage").textContent=action==="approve"?"Conta aprovada com sucesso.":"Solicitação rejeitada com sucesso.";
    }
    loadAccounts();
   }catch(error){
    console.error("Acção administrativa sobre conta:",error);
    alert("Não foi possível "+labels[action]+". Código: "+(error.code||"sem código")+" — "+(error.message||"erro desconhecido"));
    button.disabled=false;button.textContent=original;
   }
  };
 });
}
function render(){const items=Object.values(allRequests).filter(Boolean).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));if(!items.length){$("message").textContent="Não existem pedidos de pagamento."; $("requests").innerHTML="";return}$("message").textContent=items.length+" pedido(s) — actualização em tempo real pelo Realtime Database.";$("requests").innerHTML=items.map(x=>'<article class="request"><div><h3>'+esc(x.name)+' <span class="pill">'+esc(x.status)+'</span></h3><p><b>E-mail:</b> '+esc(x.email)+'<br><b>Plano:</b> '+esc(x.planName||x.plan)+'<br><b>Valor:</b> '+money(x.amount)+'<br><b>Método:</b> '+esc(x.method||"")+'<br><b>Data:</b> '+esc(x.createdAt)+'</p><p>'+esc(x.adminNote||"")+'</p><div class="row">'+(x.plan==="trial"||!x.proof?"":'<button class="secondary" data-proof="'+esc(x.id)+'">Ver comprovativo</button>')+''+(x.status==="pending"?'<button data-id="'+esc(x.id)+'" data-status="approved">Aprovar</button><button class="danger" data-id="'+esc(x.id)+'" data-status="rejected">Rejeitar</button>':"")+'</div></div><div id="proof-'+esc(x.id)+'" class="proof-panel hidden" aria-live="polite"></div></article>').join("");$("requests").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>decide(b.dataset.id,b.dataset.status,b));$("requests").querySelectorAll("button[data-proof]").forEach(b=>b.onclick=()=>viewProof(b.dataset.proof));}
function viewProof(id){const x=allRequests[id];const box=$("proof-"+id);if(!box)return;const proof=String(x?.proof||"");box.classList.remove("hidden");if(!/^data:(image\/(png|jpeg|webp)|application\/pdf);base64,/.test(proof)){box.innerHTML='<div class="row" style="justify-content:space-between"><b>Comprovativo</b><button type="button" class="secondary" data-close-proof>Fechar</button></div><p class="error">Comprovativo não encontrado ou formato inválido.</p>';}else{const media=proof.startsWith("data:application/pdf")?'<iframe class="proof" title="Comprovativo PDF" src="'+proof+'"></iframe>':'<img class="proof" style="object-fit:contain" alt="Comprovativo de pagamento" src="'+proof+'">';box.innerHTML='<div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Comprovativo de pagamento</b><button type="button" class="secondary" data-close-proof>Fechar</button></div>'+media;}box.querySelector("[data-close-proof]").onclick=()=>{box.innerHTML="";box.classList.add("hidden")};}

async function decide(id,status,button){
 const current=allRequests[id];
 if(!current||current.status!=="pending"){alert("Este pedido já não está pendente. Actualize a lista.");return;}
 const action=status==="approved"?"approve":"reject";
 const note=action==="reject"?(prompt("Motivo da rejeição (opcional):")||""):"";
 if(!confirm(action==="approve"?"Confirmar aprovação? A conta será desbloqueada e a licença activada.":"Confirmar rejeição deste pedido?"))return;
 button.disabled=true;const original=button.textContent;button.textContent=action==="approve"?"A aprovar…":"A rejeitar…";
 try{
   const result=await functions.httpsCallable("reviewTeacherPayment")({id,action,note});
   button.textContent=action==="approve"?"Aprovado":"Rejeitado";
 }catch(e){
   console.error("Decisão de pagamento:",e);
   alert("Não foi possível concluir a aprovação no Firebase. Código: "+(e.code||"sem código")+" — "+(e.message||"erro desconhecido"));
   button.disabled=false;button.textContent=original;
 }
}
</script></body></html>
