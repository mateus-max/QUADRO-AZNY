<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Remote Work Board</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#17283b;font:14px Segoe UI,Arial,sans-serif}.head{background:#071b33;color:white;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center}.head b{font-size:19px}.wrap{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:white;border:1px solid #dce4ec;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 6px 22px #12243a0a}.hidden{display:none!important}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#1769d2;color:#fff}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#e9eef5;color:#20344a}.danger{background:#b42318}.muted{color:#617286}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.request{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.8fr);gap:18px;border-top:1px solid #e5ebf1;padding:18px 0}.request:first-child{border:0}.proof{width:100%;height:300px;border:1px solid #dce4ec;border-radius:8px;background:#f6f8fa}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#fff1cc;color:#805800;font-weight:800}.error{color:#b42318}.ok{color:#187a35}@media(max-width:720px){.request{grid-template-columns:1fr}.proof{height:220px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
</head><body><header class="head"><b>Remote Work Board · Administração</b><button id="logout" class="secondary hidden">Terminar sessão</button></header>
<main class="wrap"><section id="login" class="card"><h2>Acesso administrativo</h2><p class="muted">Entre com a conta Google autorizada pela administração.</p><button id="loginBtn">Entrar com Google</button><p id="loginMsg" class="muted"></p></section>
<section id="panel" class="hidden"><div class="card row"><div style="flex:1"><h2 style="margin:0">Pedidos de pagamento</h2><p id="identity" class="muted"></p></div><button id="refresh" class="secondary">Atualizar pedidos</button></div><div id="message" class="card muted">A carregar…</div><div id="requests" class="card"></div></section></main>
<script>
const cfg={apiKey:"AIzaSyAIKbk7l-CAGmwpRgLAhccpnra8cKTNRUc",authDomain:"remot-board.firebaseapp.com",databaseURL:"https://remote-board-default-rtdb.firebaseio.com",projectId:"remot-board",storageBucket:"remot-board.firebasestorage.app",messagingSenderId:"931887981666",appId:"1:931887981666:web:08899cca83f1f514191d3b",measurementId:"G-HH3SERFF32"};
firebase.initializeApp(cfg);const auth=firebase.auth(),fn=firebase.functions("us-central1");const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("loginBtn").onclick=async()=>{try{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});await auth.signInWithPopup(p)}catch(e){$("loginMsg").textContent=e.message}};
$("logout").onclick=()=>auth.signOut();$("refresh").onclick=load;
auth.onAuthStateChanged(async user=>{if(!user){$("login").classList.remove("hidden");$("panel").classList.add("hidden");$("logout").classList.add("hidden");return}$("login").classList.add("hidden");$("panel").classList.remove("hidden");$("logout").classList.remove("hidden");$("identity").textContent=user.email||user.uid;await load()});
async function load(){ $("message").textContent="A carregar pedidos…";$("requests").innerHTML="";try{const res=await fn.httpsCallable("adminListPaymentRequests")();const items=res.data?.requests||[];if(!items.length){$("message").textContent="Não existem pedidos.";return}$("message").textContent=items.length+" pedido(s) encontrado(s).";$("requests").innerHTML=items.map(x=>{const proof=String(x.proof||"");const safeProof=/^data:(image\\/(png|jpeg|webp)|application\\/pdf);base64,/.test(proof)?proof:"";const preview=safeProof?(safeProof.startsWith("data:application/pdf")?'<iframe class="proof" src="'+safeProof+'"></iframe>':'<img class="proof" style="object-fit:contain" src="'+safeProof+'">'):'<div class="proof" style="display:grid;place-items:center">Sem comprovativo visual</div>';return '<article class="request"><div><h3>'+esc(x.name)+' <span class="pill">'+esc(x.status)+'</span></h3><p><b>E-mail:</b> '+esc(x.email)+'<br><b>Telefone:</b> '+esc(x.phone)+'<br><b>Plano:</b> '+esc(x.planName||x.plan)+'<br><b>Valor:</b> '+Number(x.amount||0).toLocaleString("pt-AO")+' Kz<br><b>Método:</b> '+esc(x.method||"Plano de teste")+'<br><b>Data:</b> '+esc(x.createdAt)+'</p><p>'+esc(x.adminNote||"")+'</p>'+(x.status==="pending"?'<div class="row"><button data-id="'+esc(x.id)+'" data-status="approved">Aprovar</button><button class="danger" data-id="'+esc(x.id)+'" data-status="rejected">Rejeitar</button></div>':'')+'</div><div>'+preview+'</div></article>'}).join("");$("requests").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>decide(b.dataset.id,b.dataset.status,b));}catch(e){$("message").innerHTML='<span class="error">'+esc(e.message)+'</span><p class="muted">Se esta conta ainda não estiver autorizada, configure o UID na variável ADMIN_UIDS das Cloud Functions e publique novamente.</p>'}}
async function decide(id,status,button){const note=status==="rejected"?prompt("Motivo da rejeição (opcional):")||"":"";if(!confirm(status==="approved"?"Confirmar aprovação deste pagamento?":"Confirmar rejeição deste pedido?"))return;button.disabled=true;try{await fn.httpsCallable("adminSetPaymentStatus")({requestId:id,status,note});await load()}catch(e){alert("Não foi possível processar: "+e.message);button.disabled=false}}
</script></body></html>
