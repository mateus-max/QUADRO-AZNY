.post-menu-wrap{position:relative;margin-left:auto;align-self:flex-start}.post-menu{border:0;background:transparent;color:#0a2544;font-size:27px;letter-spacing:2px;line-height:1;padding:2px 5px;cursor:pointer;border-radius:8px}.post-menu:focus-visible{outline:2px solid #168bd5}.post-menu-options{display:none;position:absolute;right:0;top:34px;z-index:20;min-width:190px;padding:6px;background:#fff;border:1px solid #dbe4ee;border-radius:12px;box-shadow:0 8px 24px #10233c30}.post-menu-options.open{display:grid}.post-menu-options button{border:0;background:#fff;text-align:left;padding:11px 12px;border-radius:8px;color:#1b3048;font:600 14px Arial;cursor:pointer}.post-menu-options button:hover{background:#edf5fc}

.reply-form{display:flex;flex-direction:column;gap:7px;margin:7px 0 4px}.comment-compose{display:flex;gap:8px}.comment-form [name=author],.reply-form [name=author]{width:100%;box-sizing:border-box;border:1px solid #ccd7e3;border-radius:12px;padding:10px 14px;font:inherit;background:#fff}.comment-compose input{min-width:0;flex:1}.comment-compose button{flex:none}@media(max-width:420px){.comment-compose{align-items:stretch}.comment-compose button{padding:9px 11px}}

 <section class="page-heading"><h1><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" aria-hidden="true"><path d="M5 19v12h9l19 11V8L14 19H5Z" fill="currentColor" stroke="none"/><path d="M36 17c8 4 8 12 0 16M39 9c12 8 12 26 0 32" stroke="currentColor"/></svg>Publicações</h1><p>Publicações partilhadas pela Equipa Remote Work Board.</p></section>

<script>
const config={apiKey:"AIzaSyAIKbk7l-CAGmwpRgLAhccpnra8cKTNRUc",authDomain:"remot-board.firebaseapp.com",databaseURL:"https://remot-board-default-rtdb.firebaseio.com",projectId:"remot-board",storageBucket:"remot-board.firebasestorage.app",messagingSenderId:"931887981666",appId:"1:931887981666:web:08899cca83f1f514191d3b",measurementId:"G-HH3SERFF32"};
if(!firebase.apps.length)firebase.initializeApp(config);
const feed=document.getElementById('feed'),db=firebase.database();
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatCaption(value){const safe=esc(value);const pattern=/(https?:\/\/[^\s<]+|www\.[^\s<]+|(?:[a-z0-9-]+\.)+(?:com|org|net|ao|co|io|app|edu|gov|info|biz)(?:\/[^\s<]*)?)/gi;return safe.replace(pattern,match=>{let url=match,tail='';while(/[.,!?;:)\]}]$/.test(url)){tail=url.slice(-1)+tail;url=url.slice(0,-1)}const href=/^https?:\/\//i.test(url)?url:'https://'+url;return '<a href="'+href+'" target="_blank" rel="noopener noreferrer" class="caption-link">'+url+'</a>'+tail})}
const peopleIcon='<svg viewBox="0 0 40 40" fill="currentColor" aria-hidden="true"><circle cx="20" cy="10" r="7"/><circle cx="7" cy="15" r="5"/><circle cx="33" cy="15" r="5"/><path d="M7 35c0-9 5-15 13-15s13 6 13 15H7Zm-7 0c0-7 3-11 8-12 2 0 4 1 5 2-3 3-4 6-4 10H0Zm40 0h-9c0-4-1-7-4-10 1-1 3-2 5-2 5 1 8 5 8 12Z"/></svg>';
const likeIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11H3V10h4Zm4 11h7a2 2 0 0 0 2-1.6l1.5-7A2 2 0 0 0 19.5 10H14l1-5a2 2 0 0 0-2-2l-5 7v11Z"/></svg>';
const commentIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-9 8.5 9 9 0 0 1-4-.9L3 21l1.8-4.5A8 8 0 0 1 3 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5Z"/></svg>';
const visitorId=(()=>{let id=localStorage.getItem('rwb_visitor_id');if(!id){id='v_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2));localStorage.setItem('rwb_visitor_id',id)}return id})();
function getPublicationVisitorName(){let name=String(localStorage.getItem("rwb_visitor_name")||"").trim();if(!name){name=String(prompt("Para gostar ou comentar, indique o seu nome:")||"").trim();if(name)localStorage.setItem("rwb_visitor_name",name)}return name.slice(0,60)}
const postState={};
const shareUrl=id=>location.origin+location.pathname+'#post-'+encodeURIComponent(id);
function render(snap){
 const posts=[];snap.forEach(ch=>{const p=ch.val();if(p&&p.url&&['image','video','audio'].includes(p.type))posts.push({...p,_key:ch.key})});
 posts.sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));
 if(!posts.length){feed.innerHTML='<div class="empty">Ainda não existem publicações. Volte mais tarde para acompanhar as novidades.</div>';return}
 feed.innerHTML=posts.map(p=>'<article class="post" id="post-'+esc(p._key)+'" data-post="'+esc(p._key)+'"><header class="post-header"><div class="direction-avatar">'+peopleIcon+'</div><div><div class="post-author">Equipa Remote Work Board</div><div class="post-date">'+(p.createdAt?new Date(p.createdAt).toLocaleString('pt-PT',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'')+'</div></div><div class="post-menu-wrap"><button class="post-menu" type="button" aria-label="Mais opções da publicação" aria-expanded="false" data-post-menu="'+esc(p._key)+'">•••</button><div class="post-menu-options" data-post-menu-options="'+esc(p._key)+'"><button type="button" data-menu-copy="'+esc(p._key)+'">🔗 Copiar ligação</button><button type="button" data-menu-report="'+esc(p._key)+'">⚑ Denunciar publicação</button></div></div></header>'+(p.caption?'<div class="post-caption collapsed" data-caption>'+formatCaption(p.caption)+'</div><button class="caption-toggle" type="button" aria-expanded="false">Ver mais</button>':'')+(p.type==='image'?'<img class="post-media" loading="lazy" src="'+esc(p.url)+'" alt="Imagem publicada pela Equipa Remote Work Board">':p.type==='video'?'<video class="post-media" controls playsinline preload="metadata" src="'+esc(p.url)+'"></video>':'<audio controls preload="metadata" src="'+esc(p.url)+'"></audio>')+'<div class="post-actions"><div class="post-stats"><span class="like-count">👍 0 Gostos</span><span class="comment-count">0 comentários</span><span class="share-count">↗ 0 partilhas</span></div><div class="post-action-buttons"><button class="post-action like-button" type="button" data-like="'+esc(p._key)+'">'+likeIcon+' Gostar</button><button class="post-action comment-button" type="button" data-comments="'+esc(p._key)+'">'+commentIcon+' Comentar</button><button class="post-action share-button" type="button" data-share="'+esc(p._key)+'">↗ Partilhar</button></div></div><section class="post-comments" data-comments-box="'+esc(p._key)+'"><form class="comment-form" data-comment-form="'+esc(p._key)+'"><div class="visitor-identity">A comentar como visitante identificado</div><div class="comment-compose"><input name="comment" maxlength="2000" placeholder="Escreva um comentário..." required><button type="submit">Enviar</button></div></form><div class="comment-list" data-comment-list="'+esc(p._key)+'">A carregar comentários...</div></section><div class="share-options" data-share-box="'+esc(p._key)+'"><button type="button" data-share-native="'+esc(p._key)+'">Instagram / Mais aplicações</button><button type="button" data-share-whatsapp="'+esc(p._key)+'">WhatsApp</button><button type="button" data-share-facebook="'+esc(p._key)+'">Facebook</button><button type="button" data-share-copy="'+esc(p._key)+'">Copiar ligação</button></div></article>').join('');
 feed.querySelectorAll('[data-caption]').forEach(c=>{const b=c.nextElementSibling;if(b&&c.scrollHeight>c.clientHeight+2)b.classList.add('visible')});
 posts.forEach(p=>bindPost(p._key));
 const hash=decodeURIComponent(location.hash.replace('#post-',''));if(hash){const target=document.getElementById('post-'+hash);if(target)setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'start'}),250)}
}
function bindPost(id){
 const ref=db.ref('publicationInteractions/'+id),card=feed.querySelector('[data-post="'+CSS.escape(id)+'"]');if(!card)return;
 ref.child('likes').on('value',snap=>{const likes=snap.val()||{},count=Object.keys(likes).length,liked=!!likes[visitorId];const b=card.querySelector('.like-button');b.classList.toggle('active',liked);b.innerHTML=likeIcon+(liked?' Gostado':' Gostar');card.querySelector('.like-count').textContent='👍 '+count+' '+(count===1?'Gosto':'Gostos')});
 ref.child('comments').on('value',snap=>{const comments=[];snap.forEach(c=>comments.push({...c.val(),id:c.key}));comments.sort((a,b)=>Number(a.createdAt||0)-Number(b.createdAt||0));card.querySelector('.comment-count').textContent=comments.length+' '+(comments.length===1?'comentário':'comentários');card.querySelector('[data-comment-list]').innerHTML=renderComments(comments,id)});
 ref.child('shares').on('value',snap=>{const count=Number(snap.val()||0);card.querySelector('.share-count').textContent='↗ '+count+' '+(count===1?'partilha':'partilhas')});
}
function renderComments(items,postId){
 const roots=items.filter(c=>!c.parentId);
 if(!roots.length)return '<div style="color:#718096;padding:8px">Ainda não há comentários. Seja o primeiro a comentar.</div>';
 return roots.map(c=>'<div class="comment-item"><div class="comment-bubble"><div class="comment-author">'+esc(c.author||'Visitante')+'</div><div class="comment-text">'+esc(c.text)+'</div></div><div class="comment-tools"><span>'+new Date(c.createdAt||Date.now()).toLocaleString('pt-PT')+'</span><button type="button" data-reply="'+esc(c.id)+'" data-post="'+esc(postId)+'">Responder</button></div><div class="reply-list">'+items.filter(r=>r.parentId===c.id).map(r=>'<div class="comment-item"><div class="comment-bubble"><div class="comment-author">'+esc(r.author||'Visitante')+'</div><div class="comment-text">'+esc(r.text)+'</div></div></div>').join('')+'<form class="reply-form" data-reply-form="'+esc(c.id)+'" data-post="'+esc(postId)+'"><div class="visitor-identity">A responder como visitante identificado</div><div class="comment-compose"><input name="reply" maxlength="2000" placeholder="Escreva uma resposta..." required><button type="submit">Responder</button></div></form></div></div>').join('');
}
function sendComment(postId,name,text,parentId){return db.ref('publicationInteractions/'+postId+'/comments').push({author:name,text,parentId:parentId||null,visitorId,createdAt:firebase.database.ServerValue.TIMESTAMP})}
async function registerShare(id){await db.ref('publicationInteractions/'+id+'/shares').transaction(value=>(Number(value)||0)+1)}
async function sharePost(id,mode){const url=shareUrl(id),title='Publicação — Equipa Remote Work Board';if(mode==='copy'){await navigator.clipboard.writeText(url);await registerShare(id);alert('Ligação copiada.');return}if(mode==='whatsapp'){window.open('https://wa.me/?text='+encodeURIComponent(title+' '+url),'_blank','noopener');await registerShare(id);return}if(mode==='facebook'){window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url),'_blank','noopener');await registerShare(id);return}if(navigator.share){try{await navigator.share({title,text:title,url});await registerShare(id)}catch(e){if(e.name!=='AbortError')console.warn(e)}}else{window.open('https://wa.me/?text='+encodeURIComponent(title+' '+url),'_blank','noopener');await registerShare(id)}}
feed.addEventListener('click',async event=>{
 const target=event.target.closest('button');if(!target)return;
 if(target.matches('.caption-toggle')){const c=target.previousElementSibling;if(!c||!c.matches('[data-caption]'))return;const ex=target.getAttribute('aria-expanded')==='true';c.classList.toggle('collapsed',ex);target.setAttribute('aria-expanded',String(!ex));target.textContent=ex?'Ver mais':'Ver menos';return}
 const menuId=target.dataset.postMenu||target.dataset.menuCopy||target.dataset.menuReport;
 if(target.dataset.postMenu){const wrap=target.closest('.post-menu-wrap'),box=wrap.querySelector('.post-menu-options'),was=box.classList.contains('open');feed.querySelectorAll('.post-menu-options.open').forEach(el=>el.classList.remove('open'));feed.querySelectorAll('.post-menu[aria-expanded=true]').forEach(el=>el.setAttribute('aria-expanded','false'));if(!was){box.classList.add('open');target.setAttribute('aria-expanded','true')}return}
 if(target.dataset.menuCopy){try{await navigator.clipboard.writeText(shareUrl(menuId));alert('Ligação da publicação copiada.')}catch(e){prompt('Copie a ligação da publicação:',shareUrl(menuId))}feed.querySelector('[data-post-menu-options="'+CSS.escape(menuId)+'"]').classList.remove('open');return}
 if(target.dataset.menuReport){const reason=prompt('Indique o motivo da denúncia desta publicação:');if(reason&&reason.trim()){try{await db.ref('publicationReports').push({publicationId:menuId,reason:reason.trim().slice(0,500),createdAt:firebase.database.ServerValue.TIMESTAMP,visitorId});alert('Denúncia enviada. Obrigado pelo seu contributo.')}catch(e){alert('Não foi possível enviar a denúncia: '+e.message)}}feed.querySelector('[data-post-menu-options="'+CSS.escape(menuId)+'"]').classList.remove('open');return}
 const id=target.dataset.like||target.dataset.comments||target.dataset.share||target.dataset.shareNative||target.dataset.shareWhatsapp||target.dataset.shareFacebook||target.dataset.shareCopy;
 if(target.dataset.like){const name=getPublicationVisitorName();if(!name)return;const ref=db.ref('publicationInteractions/'+id+'/likes/'+visitorId);const snap=await ref.once('value');await (snap.exists()?ref.remove():ref.set({name:name,visitorId:visitorId,createdAt:firebase.database.ServerValue.TIMESTAMP}));return}
 if(target.dataset.comments){const name=getPublicationVisitorName();if(!name)return;const box=feed.querySelector('[data-comments-box="'+CSS.escape(id)+'"]');box.classList.toggle('open');return}
 if(target.dataset.share){const name=getPublicationVisitorName();if(!name)return;feed.querySelector('[data-share-box="'+CSS.escape(id)+'"]').classList.toggle('open');return}
 if(target.dataset.shareNative||target.dataset.shareWhatsapp||target.dataset.shareFacebook||target.dataset.shareCopy){const name=getPublicationVisitorName();if(!name)return;const mode=target.dataset.shareWhatsapp?'whatsapp':target.dataset.shareFacebook?'facebook':target.dataset.shareCopy?'copy':'native';try{await sharePost(id,mode)}catch(e){alert('Não foi possível partilhar: '+e.message)}return}
 if(target.dataset.reply){const name=getPublicationVisitorName();if(!name)return;const form=feed.querySelector('[data-reply-form="'+CSS.escape(target.dataset.reply)+'"]');if(form)form.scrollIntoView({behavior:'smooth',block:'center'});}
});
feed.addEventListener('submit',async event=>{const form=event.target;if(!form.matches('[data-comment-form],[data-reply-form]'))return;event.preventDefault();const postId=form.dataset.commentForm||form.dataset.post,parent=form.dataset.replyForm||null,textInput=form.querySelector('[name=comment],[name=reply]'),name=getPublicationVisitorName(),text=textInput.value.trim();if(!name||!text)return;const button=form.querySelector('button[type=submit]');button.disabled=true;try{await sendComment(postId,name,text,parent);textInput.value=''}catch(e){alert('Não foi possível enviar o comentário: '+e.message)}finally{button.disabled=false}});

let publicationRetryTimer=null,publicationRetryDelay=1000,publicationListenerActive=false;
function showPublicationLoading(message){if(!feed.querySelector('.post')&&!feed.querySelector('.empty'))feed.innerHTML='<div class="loading" role="status" aria-live="polite">'+message+'</div>'}
function subscribePublications(){if(publicationListenerActive)return;publicationListenerActive=true;const ref=db.ref('publications');ref.off('value',render);ref.on('value',snap=>{publicationRetryDelay=1000;if(publicationRetryTimer){clearTimeout(publicationRetryTimer);publicationRetryTimer=null}render(snap)},error=>{publicationListenerActive=false;console.warn('Ligação às publicações temporariamente indisponível:',error);showPublicationLoading('A ligar às publicações... a tentar novamente automaticamente.');if(publicationRetryTimer)clearTimeout(publicationRetryTimer);publicationRetryTimer=setTimeout(()=>{publicationRetryTimer=null;subscribePublications()},publicationRetryDelay);publicationRetryDelay=Math.min(publicationRetryDelay*2,15000)})}
subscribePublications();
</script>
</body></html>
