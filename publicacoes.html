<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicações — Remote Work Board</title><meta name="theme-color" content="#061a32"><style>*{box-sizing:border-box}body{margin:0;background:#071a30;color:#10243c;font-family:Arial,Helvetica,sans-serif}.top{background:linear-gradient(110deg,#06172d,#0b3c69);color:#fff;padding:20px max(18px,calc((100% - 900px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:900;font-size:clamp(18px,4vw,25px)}.brand span{color:#09aaff}.back{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:10px;padding:10px 14px;font-weight:700}.wrap{width:min(760px,calc(100% - 24px));margin:22px auto 50px}.intro{color:#d6e5f5;margin:0 0 18px;line-height:1.5}.feed{display:grid;gap:18px}.post{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 26px #0003}.post-head{padding:16px 18px 10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.author{font-weight:800;color:#0a3765}.date{font-size:12px;color:#718096}.caption{padding:0 18px 15px;white-space:pre-wrap;line-height:1.55;color:#26384c}.media{display:block;width:100%;max-height:680px;object-fit:contain;background:#080d14}.post audio{width:calc(100% - 32px);margin:8px 16px 18px}.empty,.loading,.error{background:#fff;border-radius:14px;padding:25px;text-align:center;color:#526274;line-height:1.5}.error{color:#a32929}.footer{text-align:center;color:#9db5ce;font-size:12px;margin-top:24px}</style><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script></head><body><header class="top"><div class="brand">REMOTE WORK <span>BOARD</span></div><a class="back" href="index.html">Página principal</a></header><main class="wrap"><p class="intro">Publicações partilhadas pela direção do Quadro Virtual AZNY.</p><div id="feed" class="feed"><div class="loading">A carregar publicações...</div></div><div class="footer">Remote Work Board · Quadro Virtual AZNY</div></main><script>const config={apiKey:"AIzaSyB20GNxPQsMRmjF0RpRyQ8rNoNdpcgq13Y",authDomain:"quadro-azny.firebaseapp.com",databaseURL:"https://quadro-azny-default-rtdb.firebaseio.com",projectId:"quadro-azny",storageBucket:"quadro-azny.firebasestorage.app",messagingSenderId:"204452366229",appId:"1:204452366229:web:f5e62cd92d999b9c04d89c",measurementId:"G-RP2TV02LKY"};if(!firebase.apps.length)firebase.initializeApp(config);const db=firebase.database(),feed=document.getElementById('feed');function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(snap){const posts=[];snap.forEach(ch=>{const p=ch.val();if(p&&p.url&&['image','video','audio'].includes(p.type))posts.push(p)});posts.sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));if(!posts.length){feed.innerHTML='<div class="empty">Ainda não existem publicações. Volte mais tarde para acompanhar as novidades.</div>';return}feed.innerHTML=posts.map(p=>'<article class="post"><div class="post-head"><span class="author">📢 Direção — Quadro Virtual AZNY</span><time class="date">'+(p.createdAt?new Date(p.createdAt).toLocaleString('pt-AO'):'')+'</time></div>'+(p.caption?'<div class="caption">'+esc(p.caption)+'</div>':'')+(p.type==='image'?'<img class="media" loading="lazy" src="'+esc(p.url)+'" alt="Publicação da direção">':p.type==='video'?'<video class="media" controls playsinline preload="metadata" src="'+esc(p.url)+'"></video>':'<audio controls preload="metadata" src="'+esc(p.url)+'"></audio>')+'</article>').join('')}firebase.auth().signInAnonymously().then(()=>db.ref('publications').on('value',render)).catch(e=>{console.error(e);feed.innerHTML='<div class="error">Não foi possível carregar as publicações.
