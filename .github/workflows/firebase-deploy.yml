name: Deploy Firebase Remote Work Board
on:
  push:
    branches: [main, master]
    paths:
      - 'functions/**'
      - 'database.rules.json'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install function dependencies
        working-directory: functions
        run: npm ci
      - name: Check function syntax
        working-directory: functions
        run: node --check index.js
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REMOT_BOARD }}
      - name: Setup Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy functions and Realtime Database rules
        run: firebase deploy --project remot-board --only functions,database --non-interactive
