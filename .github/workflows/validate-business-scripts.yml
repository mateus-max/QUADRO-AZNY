name: Validate Remote Work Board scripts
on:
  push:
    paths:
      - "azny_business.html"
      - ".github/workflows/validate-business-scripts.yml"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path("azny_business.html").read_text()
          scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html, re.I)
          pathlib.Path("/tmp").mkdir(exist_ok=True)
          for i, script in enumerate(scripts, 1):
              pathlib.Path(f"/tmp/rwb-{i}.js").write_text(script)
          print(f"Extracted {len(scripts)} inline scripts")
          PY
          for file in /tmp/rwb-*.js; do
            echo "Checking $file"
            node --check "$file"
          done
