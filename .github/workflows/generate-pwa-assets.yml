name: Generate AZNY PWA assets
on:
  workflow_dispatch:
  push:
    paths:
      - "icons/azny-exam.svg"
      - "screenshots/*.svg"
      - "manifest.webmanifest"
      - ".github/workflows/generate-pwa-assets.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check cairosvg
      - name: Render PNG icons and install screenshots
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          jobs = [
              ("icons/azny-exam.svg", "icons/azny-exam-192.png", 192),
              ("icons/azny-exam.svg", "icons/azny-exam-512.png", 512),
              ("screenshots/azny-exams-mobile.svg", "screenshots/azny-exams-mobile.png", None),
              ("screenshots/azny-dashboard-desktop.svg", "screenshots/azny-dashboard-desktop.png", None),
          ]
          for source, target, size in jobs:
              src = Path(source)
              if not src.exists():
                  continue
              kwargs = {"url": str(src), "write_to": target}
              if size:
                  kwargs.update(output_width=size, output_height=size)
              cairosvg.svg2png(**kwargs)
              print(f"Generated {target}")
          PY
      - name: Commit generated PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/*.png screenshots/*.png
          if git diff --cached --quiet; then
            echo "No generated assets changed."
          else
            git commit -m "Generate AZNY PWA icons and screenshots"
            git push
          fi
