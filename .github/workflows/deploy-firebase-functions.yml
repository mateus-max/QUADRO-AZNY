name: Deploy Firebase approval functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "database.rules.json"
      - "firebase.json"
      - ".github/workflows/deploy-firebase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Firebase function source
        working-directory: functions
        run: |
          node --check index.js
          npm install --omit=dev --no-package-lock

      - name: Check Firebase deployment credentials
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REMOT_BOARD }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$GCP_SA_KEY" ] && [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Faltam credenciais Firebase. Crie o secret FIREBASE_SERVICE_ACCOUNT_REMOT_BOARD em Settings > Secrets and variables > Actions com a chave JSON de uma service account autorizada a publicar Cloud Functions."
            exit 1
          fi

      - name: Deploy Firebase functions and Realtime Database rules
        uses: w9jds/firebase-action@v13.24.0
        with:
          args: deploy --only functions,database --project remot-board --non-interactive
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REMOT_BOARD }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
