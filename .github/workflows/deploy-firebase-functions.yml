name: Legacy Firebase Functions (manual only)

# O registo de professores, os pedidos de pagamento e a aprovação administrativa
# funcionam directamente com Firebase Authentication + Realtime Database.
# Este workflow fica manual para não publicar Cloud Functions automaticamente.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate legacy source only
        working-directory: functions
        run: |
          node --check index.js
          npm install --omit=dev
