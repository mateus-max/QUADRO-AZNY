name: Deploy Firebase approval functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-firebase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Firebase function source
        working-directory: functions
        run: |
          node --check index.js
          npm ci --omit=dev

      - name: Deploy approval functions to Firebase
        uses: w9jds/firebase-action@v13.24.0
        with:
          args: deploy --only functions --project remot-board --non-interactive
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REMOT_BOARD }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
